name: DhampirOS image candidates

on:
  workflow_dispatch:
  push:
    branches: ['codex/downloadable-images']
    paths:
      - '.github/workflows/local-images.yml'
      - 'ci/image-*.sh'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'potemkin666/DhampirOS'
    strategy:
      fail-fast: false
      matrix:
        target: [iso, virtualbox]
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - name: Checkout exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: false
      - name: Prepare isolated runner and pinned submodules
        run: ./ci/image-host.sh prepare
      - name: Build full DhampirOS desktop without test boot backdoors
        env:
          IMAGE_TARGET: ${{ matrix.target }}
        run: ./ci/image-host.sh build
      - name: Preserve candidates and build evidence for independent verification
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dhampiros-${{ matrix.target }}-candidate
          path: artifacts/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
